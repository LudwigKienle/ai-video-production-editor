name: Repository Guard

on:
  push:
  pull_request:

jobs:
  public-release-check:
    name: Keep private data out of the public repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Block local paths, secrets and private artifacts
        run: node scripts/check-public-release.mjs --strict-artifacts
